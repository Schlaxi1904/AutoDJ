[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-dj"
version = "0.1.0"
description = "Auto-DJ control system with OSC lighting integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "python-osc",
    "itsdangerous",
    "jinja2>=3.1",
    "python-multipart",
    "psutil",
    "alembic",
]

[project.optional-dependencies]
dev = ["black", "ruff"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"auto_dj" = [
    "web/templates/*.html",
    "web/static/*",
    "web/static/**/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
ignore = ["B008"]
