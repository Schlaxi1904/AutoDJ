[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-dj"
version = "0.1.1"
description = "Auto-DJ control system with OSC lighting integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.103",
    "uvicorn>=0.22",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-osc>=1.9",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "bcrypt>=4.1",
    "cffi>=1.15",
    "python-multipart>=0.0.9",
    "starlette>=0.36",
    "psutil>=5.9",
    "alembic>=1.11",
]

[project.optional-dependencies]
dev = ["black", "ruff"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"auto_dj.web" = [
    "templates/*.html",
    "templates/**/*.html",
    "static/**/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
ignore = ["B008"]
